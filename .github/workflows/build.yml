name: Build Chinese Meteor Client

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: false
        type: choice
        options:
          - full
          - patch-only
          - replace-string
          - compile-original
        default: full
      build_number:
        description: Build number
        required: false
        type: string
        default: ''
      upstream_ref:
        description: 'Upstream branch/tag/commit (e.g. 1.21.1, master)'
        required: false
        type: string
        default: master
      skip_sync:
        description: Skip syncing translations back to repo
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout builder repo (patches, scripts, fonts)
        uses: actions/checkout@v6
        with:
          repository: wzmwayne/meteor-client-auto-cn-builder
          path: builder
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Checkout upstream Meteor Client
        uses: actions/checkout@v6
        with:
          repository: MeteorDevelopment/meteor-client
          ref: ${{ inputs.upstream_ref }}
          path: meteor-client

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Copy patches, scripts, fonts to upstream checkout
        if: ${{ inputs.mode != 'compile-original' }}
        run: |
          cp -r builder/patches/ meteor-client/patches/
          cp -r builder/scripts/ meteor-client/scripts/
          mkdir -p "meteor-client/src/main/resources/assets/meteor-client/fonts/"
          cp builder/fonts/*.ttf "meteor-client/src/main/resources/assets/meteor-client/fonts/"

      - name: Apply patches (font/)
        if: ${{ inputs.mode != 'compile-original' }}
        working-directory: meteor-client
        run: |
          for p in patches/font/*.patch; do
            echo "Applying font/$(basename $p)..."
            if ! git apply "$p"; then
              echo "::error::Failed to apply font/$(basename $p) - upstream may have changed"
              exit 1
            fi
          done
          echo "Font patches applied successfully"

      - name: Apply patches (translate/)
        if: ${{ inputs.mode == 'full' }}
        working-directory: meteor-client
        run: |
          for p in patches/translate/*.patch; do
            echo "Applying translate/$(basename $p)..."
            if ! git apply "$p"; then
              echo "::error::Failed to apply translate/$(basename $p) - upstream may have changed"
              exit 1
            fi
          done
          echo "Translate patches applied successfully"

      - name: Run translation
        if: ${{ inputs.mode == 'full' || inputs.mode == 'replace-string' }}
        working-directory: meteor-client
        run: |
          pip install deep-translator -q
          python3 scripts/translate.py

      - name: Replace strings at compile time
        if: ${{ inputs.mode == 'replace-string' }}
        working-directory: meteor-client
        run: python3 scripts/replace_strings.py

      - name: Build with Gradle
        working-directory: meteor-client
        run: |
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="cn-$(date +%Y%m%d%H%M)"
          fi
          ./gradlew build -Pbuild_number="$BUILD_NUMBER" --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: meteor-client-${{ inputs.mode }}-${{ github.run_id }}
          path: meteor-client/build/libs/*.jar
          retention-days: 30

      - name: Sync translations back to builder repo
        if: ${{ (inputs.mode == 'full' || inputs.mode == 'replace-string') && !inputs.skip_sync }}
        working-directory: builder
        run: |
          cp ../meteor-client/scripts/translations.json scripts/translations.json
          git config user.name "Meteor CN Builder Bot"
          git config user.email "bot@meteor.cn"
          git add scripts/translations.json
          if git diff --cached --quiet; then
            echo "No changes to translations.json"
          else
            git commit -m "sync: update translations from upstream ${{ inputs.upstream_ref }}"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wzmwayne/meteor-client-auto-cn-builder.git"
            git push
          fi
